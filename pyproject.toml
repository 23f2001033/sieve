[project]
name = "sieve"
version = "0.1.0"
description = "A storefront any AI agent can safely shop from — and that proves it."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
agents = [
    "anthropic>=0.40.0",
    "mcp>=1.1.0",
]
razorpay = [
    "razorpay>=1.4.2",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
