<style>
  html, body { height: 100%; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #262b38; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes pulse-dot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }

  return <span className="text-faint text-sm">·</span>;
}

function MerkleTree({ tampered }) {
  const levels = [8, 4, 2, 1];
  const badLeaf = 3;
  const badSet = tampered ? { 0: new Set([badLeaf]), 1: new Set([1]), 2: new Set([0]), 3: new Set([0]) } : {};
  return (
    <div className="flex flex-col-reverse gap-3 items-center py-2">
      {levels.map((count, li) => (
        <div key={li} className="flex gap-2 justify-center">
          {Array.from({ length: count }).map((_, i) => {
            const bad = badSet[li] && badSet[li].has(i);
            const c = bad ? '#FF4D4F' : '#00D26A';
            return <span key={i} className={`w-2.5 h-2.5 rounded-full ${bad ? '' : 'pulse'}`}
                         style={{ background: c, boxShadow: `0 0 7px ${c}`, animationDelay: `${i * 90}ms` }} />;
          })}
        </div>
      ))}
    </div>
  );
}

              className={`relative w-9 h-5 rounded-full transition-colors ${tampered ? 'bg-bad' : 'bg-line'}`}>
          <span className={`absolute top-0.5 w-4 h-4 rounded-full bg-white transition-all ${tampered ? 'left-[18px]' : 'left-0.5'}`} />
        </span>
      </label>
    </div>
  );
}

function ConcurrencyPanel() {
  const rows = Array.from({ length: 10 }, (_, i) => {
    const start = 2 + i * 3.4 + (i % 3);
    const width = 30 - i * 0.6;
    return { id: 'r' + String(i + 1).padStart(2, '0'), start, width, winner: i === 0 };
  });
  return (
    <div className="p-4 flex flex-col gap-3 overflow-y-auto">
      <span className="text-[11px] font-semibold tracking-wider text-dim">CONCURRENCY VISUALISER</span>
      <div className="font-mono text-[10.5px] text-dim">attack #13 · 10 × POST /v1/pay · same idempotency key</div>
      <div className="rounded-md border border-ok/30 bg-ok/[0.06] px-3 py-2 text-[11px] font-semibold text-ok text-center">
        1 winner · 9 idempotent replays
      </div>
      <div className="flex flex-col gap-1.5 pt-1">
        {rows.map((r) => (
          <div key={r.id} className="flex items-center gap-2">
            <span className="text-[9px] font-mono text-faint w-6">{r.id}</span>
            <div className="flex-1 h-4 relative rounded bg-bg border border-line/50 overflow-hidden">
              <div className="absolute top-0 bottom-0 rounded-sm flex items-center justify-end pr-1"
                   style={{ left: r.start + '%', width: r.width + '%',
                            background: r.winner ? 'linear-gradient(90deg,#00D26A55,#00D26A)' : '#2a3140' }}>
                {r.winner && <span className="text-[8px] font-bold text-bg">201 paid</span>}
              </div>
            </div>
            <span className={`text-[9px] font-mono w-14 text-right ${r.winner ? 'text-ok font-semibold' : 'text-faint'}`}>
              {r.winner ? 'winner' : '200 replay'}
            </span>
          </div>
        ))}
      </div>
      <div className="flex justify-between text-[9px] font-mono text-faint px-8">
        <span>t=0 ms</span><span>t=46 ms</span>
      </div>
      <div className="text-[10.5px] text-dim leading-relaxed border-t border-line pt-2">
        One Razorpay order created. Nine callers received the same order from the ledger — not a second charge.
        <div className="font-mono text-faint mt-1">UNIQUE(mandate_id, idem_key) · SQLite WAL</div>
      </div>
    </div>
  );
}

function DifferentialPanel() {
  const cols = [
    { k: 'NAIVE', verdict: 'ALLOWED', c: '#FF4D4F', reason: 'Checks only the leaf mandate’s amount cap. Never walks the chain, so a widened capability slips through.' },
    { k: 'SIEVE', verdict: 'BLOCKED', c: '#00D26A', reason: 'Narrowing invariant enforced per hop. "refund" ∉ parent’s grant → refused before any money moves.' },
    { k: 'RZP-MCP', verdict: '—', c: '#FFB020', reason: 'Raw payment API, no delegation layer. Not built to check this — it’s what needs a bounds layer in front.' },
  ];
  return (
    <div className="p-4 flex flex-col gap-3 overflow-y-auto">
      <span className="text-[11px] font-semibold tracking-wider text-dim">DIFFERENTIAL · ATTACK #07</span>
      <div className="font-mono text-[10.5px] text-dim">authority widening at a hop — same input, three gateways</div>
      <div className="flex flex-col gap-2.5 pt-1">
        {cols.map((c) => (
          <div key={c.k} className="rounded-lg border p-3" style={{ borderColor: c.c + '40', background: c.c + '0a' }}>
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[12px] font-semibold">{c.k}</span>
              <span className="text-[11px] font-bold px-2 py-0.5 rounded" style={{ color: c.c, background: c.c + '1a' }}>{c.verdict}</span>
            </div>
            <p className="text-[11.5px] leading-relaxed text-dim">{c.reason}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function RightPanel() {
  const [mode, setMode] = useState('ledger');
  const tabs = [['ledger', 'Ledger'], ['concurrency', 'Concurrency'], ['differential', 'Differential']];
  return (
    <aside className="w-[320px] shrink-0 flex flex-col bg-panel/30 overflow-hidden">
      <div className="flex items-center gap-1 px-2 h-10 border-b border-line">
        {tabs.map(([k, label]) => (
          <button key={k} onClick={() => setMode(k)}
            className={`text-[11px] font-semibold px-2.5 py-1 rounded transition-colors ${mode === k ? 'text-txt bg-accent/15 border border-accent/40' : 'text-dim hover:text-txt border border-transparent'}`}>
            {label}
          </button>
        ))}
      </div>
      <div className="flex-1 overflow-hidden">
        {mode === 'ledger' && <LedgerPanel />}
        {mode === 'concurrency' && <ConcurrencyPanel />}
        {mode === 'differential' && <DifferentialPanel />}
      </div>
    </aside>
  );
}

const EV_COLOR = { ALLOW: '#00D26A', REFUSE: '#FF4D4F', PROV: '#8B8F99' };
function SSEStrip({ lines }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [lines]);
  return (
    <footer className="h-[132px] shrink-0 border-t border-line bg-panel/40 flex flex-col">
      <div className="flex items-center gap-2 px-4 h-8 border-b border-line/60">
        <span className="text-[11px] font-semibold tracking-wider text-dim">DECISION TRACE</span>
        <span className="text-[10px] font-mono text-faint">GET /v1/trace · text/event-stream</span>
        <div className="flex-1" />
        <span className="flex items-center gap-1.5 text-[10px] text-ok"><Dot color="#00D26A" pulse /> streaming</span>
      </div>
      <div ref={ref} className="flex-1 overflow-y-auto px-4 py-1.5 font-mono text-[11px] leading-[1.5]">
        {lines.map((l, i) => (
          <div key={i} className="flex items-center gap-3 rowin">
            <span className="text-faint tnum">{l.t}</span>
            <span className="w-40" style={{ color: l.v === 'REFUSE' ? '#FF4D4F' : l.v === 'ALLOW' ? '#00D26A' : '#8B8F99' }}>{l.ev}</span>
            <span className="text-faint">sha256:{l.hash}</span>
            <div className="flex-1" />
            <span className="text-[10px] font-semibold px-1.5 rounded" style={{ color: EV_COLOR[l.v], background: EV_COLOR[l.v] + '18' }}>{l.v}</span>
          </div>
        ))}
      </div>
    </footer>
  );
}

function App() {
  const initStates = ATTACKS.map((_, i) => i < 6 ? 'contained' : i === 6 ? 'progress' : 'pending');
  const [states, setStates] = useState(initStates);
  const [running, setRunning] = useState(false);
  const [sse, setSse] = useState(INIT_SSE);
  const contained = states.filter((s) => s === 'contained').length;

  const pushSse = useCallback((ev, v) => {
    setSse((prev) => [...prev.slice(-40), { t: now(), ev, hash: rndHash(), v }]);
  }, []);

  // ambient trace stream
  useEffect(() => {
    const evs = [['MANDATE_VERIFIED', 'ALLOW'], ['POLICY_ALLOWED', 'ALLOW'], ['LEDGER_APPENDED', 'PROV'], ['CHECKOUT_SETTLED', 'ALLOW']];
    const id = setInterval(() => { const [ev, v] = evs[Math.floor(Math.random() * evs.length)]; pushSse(ev, v); }, 2600);
    return () => clearInterval(id);
  }, [pushSse]);

  const runAll = useCallback(() => {
    if (running) return;
    setRunning(true);
    let i = 6;
    const step = () => {
      setStates((prev) => { const n = [...prev]; if (i < 16) n[i] = 'contained'; return n; });
      pushSse(i === 6 ? 'POLICY_REFUSED' : ['MANDATE_VERIFIED', 'POLICY_REFUSED', 'LEDGER_APPENDED'][i % 3], i % 3 === 1 || i === 6 ? 'REFUSE' : 'PROV');
      i += 1;
      if (i < 16) { setTimeout(step, 230); } else { setRunning(false); }
    };
    setTimeout(step, 200);
  }, [running, pushSse]);

  return (
    <div className="h-full flex flex-col bg-bg text-txt">
      <StatusBar contained={contained} />
      <div className="flex-1 flex overflow-x-auto overflow-y-hidden">
        <Storefront />
        <Pipeline />
        <Scoreboard states={states} onRun={runAll} running={running} />
        <RightPanel />
      </div>
      <SSEStrip lines={sse} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
